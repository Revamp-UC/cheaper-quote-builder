<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visually Similar Panels</title>
<link rel="stylesheet" href="css/styles.css?v=11">
<style>
.city-tabs{display:flex;gap:6px;margin:14px 0 4px}
.city-tab{padding:6px 16px;border-radius:20px;border:1px solid #25283a;background:#1a1d27;color:#6b7080;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .15s}
.city-tab:hover{border-color:#4a9eff;color:#e8eaf0}
.city-tab.active{background:#4a9eff;border-color:#4a9eff;color:#fff}
</style>
</head><body>

<header>
<div class="qb-topbar">
  <a href="index.html" class="qb-btn qb-btn-ghost qb-btn-lg">← Cities</a>
  <a id="quoteLink" href="quote.html?city=delhi" class="qb-btn qb-btn-primary qb-btn-lg">⬆ Upload Quote</a>
</div>
<h1>Visually Similar Panels</h1>
<div class="city-tabs">
  <a class="city-tab" data-city="delhi">Delhi</a>
  <a class="city-tab" data-city="mumbai">Mumbai</a>
  <a class="city-tab" data-city="bengaluru">Bengaluru</a>
  <a class="city-tab" data-city="hyderabad">Hyderabad</a>
</div>
<div class="toolbar">
  <label class="toggle">
    <input id="cheapOnly" type="checkbox">
    <span class="knob"></span>
    <span class="toggle-label">Cheaper alternatives only</span>
  </label>
  <div class="searchbox">
    <svg class="search-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="q" type="search" placeholder="Search by panel code, name, or material" autocomplete="off">
  </div>
</div>
<span id="resCount"></span>
</header>

<main id="catalog"></main>

<script src="js/catalog.js?v=1"></script>
</body></html>
