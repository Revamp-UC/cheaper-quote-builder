<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheap Quote Builder</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#0F1624 0%,#141D2E 100%);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}

/* corner blobs */
.blob{position:fixed;border-radius:50%;pointer-events:none;filter:blur(90px)}
.blob-tl{width:420px;height:420px;top:-130px;left:-130px;background:radial-gradient(circle,rgba(45,100,255,0.18),transparent 70%)}
.blob-br{width:380px;height:380px;bottom:-110px;right:-110px;background:radial-gradient(circle,rgba(77,163,255,0.14),transparent 70%)}

.wrap{
  position:relative;z-index:1;
  width:100%;max-width:520px;
  padding:44px 24px 40px;
}

/* ── Logo ── */
.logo-outer{display:flex;justify-content:center;margin-bottom:28px}
.logo-inner{
  display:flex;align-items:center;gap:11px;
  padding:10px 18px;
  border:1.5px solid #4DA3FF;
  border-radius:14px;
}
.uc-badge{
  width:38px;height:38px;border-radius:9px;
  background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:#0a0f1e;letter-spacing:-0.5px;
  flex-shrink:0;
}
.uc-name{display:flex;flex-direction:column;line-height:1.25;gap:1px}
.uc-name span{font-size:14px;font-weight:600;color:#fff}

/* ── Headline ── */
h1{
  text-align:center;
  font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;
  color:#fff;margin-bottom:13px;
}
.grad{
  background:linear-gradient(90deg,#4DA3FF,#2B6BFF);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.subtitle{
  text-align:center;font-size:15px;color:#A8B3C7;
  line-height:1.6;margin-bottom:38px;
}

/* ── Section title ── */
.sec{font-size:21px;font-weight:700;color:#fff;margin-bottom:14px}

/* ── City cards ── */
.cities{display:flex;flex-direction:column;gap:10px}
.city{
  display:flex;align-items:center;gap:16px;
  padding:15px 20px;
  background:#1B2436;
  border:1px solid rgba(255,255,255,0.06);
  border-radius:16px;
  text-decoration:none;
  cursor:pointer;
  transition:border-color .18s,transform .14s,box-shadow .18s;
}
.city:hover{
  border-color:rgba(77,163,255,0.45);
  transform:translateX(5px);
  box-shadow:0 6px 24px rgba(77,163,255,0.10);
}
.city:active{transform:translateX(2px)}

.ic{
  width:52px;height:52px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ic svg{width:30px;height:30px}
.ic-dl{background:rgba(77,163,255,0.13);color:#4DA3FF}
.ic-mu{background:rgba(52,199,89,0.13); color:#34C759}
.ic-bn{background:rgba(175,82,222,0.13);color:#AF52DE}
.ic-hd{background:rgba(255,149,0,0.13); color:#FF9500}

.city-info{flex:1}
.city-name{font-size:17px;font-weight:700;color:#fff;margin-bottom:3px}
.city-ct{font-size:13px;color:#A8B3C7}
.city-arr{font-size:22px;color:#4DA3FF;line-height:1}
</style>
</head><body>

<div class="blob blob-tl"></div>
<div class="blob blob-br"></div>

<div class="wrap">

  <!-- Logo -->
  <div class="logo-outer">
    <div class="logo-inner">
      <div class="uc-badge">uc</div>
      <div class="uc-name"><span>Urban</span><span>Company</span></div>
    </div>
  </div>

  <!-- Title -->
  <h1><span class="grad">Cheap Quote</span> Builder</h1>
  <p class="subtitle">Make your quote cheaper without changing the taste of the customer.</p>

  <!-- City list -->
  <div class="sec">Select city</div>
  <div class="cities">

    <!-- Delhi -->
    <a class="city" href="quote.html?city=delhi">
      <div class="ic ic-dl">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- base platform -->
          <line x1="4" y1="27" x2="28" y2="27"/>
          <path d="M6 27v-2h20v2"/>
          <!-- pillars -->
          <line x1="10" y1="25" x2="10" y2="17"/>
          <line x1="22" y1="25" x2="22" y2="17"/>
          <!-- arch -->
          <path d="M10 17 C10 9 22 9 22 17"/>
          <!-- top finial -->
          <line x1="14.5" y1="10.5" x2="17.5" y2="10.5"/>
          <line x1="16" y1="8" x2="16" y2="10.5"/>
        </svg>
      </div>
      <div class="city-info">
        <div class="city-name">Delhi</div>
        <div class="city-ct">90 panels</div>
      </div>
      <div class="city-arr">→</div>
    </a>

    <!-- Mumbai -->
    <a class="city" href="quote.html?city=mumbai">
      <div class="ic ic-mu">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- base -->
          <line x1="3" y1="27" x2="29" y2="27"/>
          <line x1="5" y1="25" x2="27" y2="25"/>
          <!-- left tower -->
          <path d="M7 25v-9l2.5-3.5L12 16v9"/>
          <!-- right tower -->
          <path d="M20 25v-9l2.5-3.5L25 16v9"/>
          <!-- main arch (pointed) -->
          <path d="M12 25v-8 Q16 7 20 17v8"/>
        </svg>
      </div>
      <div class="city-info">
        <div class="city-name">Mumbai</div>
        <div class="city-ct">85 panels</div>
      </div>
      <div class="city-arr">→</div>
    </a>

    <!-- Bengaluru -->
    <a class="city" href="quote.html?city=bengaluru">
      <div class="ic ic-bn">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- dome -->
          <path d="M10 16 Q10 8 16 8 Q22 8 22 16"/>
          <!-- dome neck -->
          <line x1="13" y1="16" x2="19" y2="16"/>
          <!-- drum -->
          <rect x="8" y="16" width="16" height="4" rx="1"/>
          <!-- columns body -->
          <rect x="5" y="20" width="22" height="5" rx="1"/>
          <!-- base steps -->
          <line x1="3" y1="27" x2="29" y2="27"/>
          <line x1="5" y1="25" x2="27" y2="25"/>
          <!-- column lines -->
          <line x1="10" y1="20" x2="10" y2="25"/>
          <line x1="16" y1="20" x2="16" y2="25"/>
          <line x1="22" y1="20" x2="22" y2="25"/>
        </svg>
      </div>
      <div class="city-info">
        <div class="city-name">Bengaluru</div>
        <div class="city-ct">92 panels</div>
      </div>
      <div class="city-arr">→</div>
    </a>

    <!-- Hyderabad -->
    <a class="city" href="quote.html?city=hyderabad">
      <div class="ic ic-hd">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- left minaret -->
          <line x1="7" y1="26" x2="7" y2="10"/>
          <path d="M5 10 Q7 7 9 10"/>
          <circle cx="7" cy="14" r="1.2"/>
          <!-- right minaret -->
          <line x1="25" y1="26" x2="25" y2="10"/>
          <path d="M23 10 Q25 7 27 10"/>
          <circle cx="25" cy="14" r="1.2"/>
          <!-- center body -->
          <rect x="9" y="16" width="14" height="10" rx="1"/>
          <!-- center arch -->
          <path d="M11 26v-5 Q16 16 21 21v5"/>
          <!-- base -->
          <line x1="4" y1="27" x2="28" y2="27"/>
          <!-- top element -->
          <line x1="13" y1="16" x2="19" y2="16"/>
        </svg>
      </div>
      <div class="city-info">
        <div class="city-name">Hyderabad</div>
        <div class="city-ct">94 panels</div>
      </div>
      <div class="city-arr">→</div>
    </a>

  </div>
</div>
</body></html>
