<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quote Builder</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1015;--surface:#16192200;--card:#1a1d27;--border:#25283a;--text:#e8eaf0;--sub:#5c6070;--blue:#4a9eff;--blue-glow:rgba(74,158,255,0.10)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:420px;padding:40px 20px}
.logo{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin-bottom:32px}
h1{font-size:28px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
.hint{font-size:14px;color:var(--sub);margin-bottom:32px}
.cities{display:flex;flex-direction:column;gap:8px}
.city{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:var(--card);border:1px solid var(--border);border-radius:12px;text-decoration:none;color:var(--text);transition:border-color .15s,background .15s,transform .12s}
.city:hover{border-color:var(--blue);background:var(--blue-glow);transform:translateX(3px)}
.city:active{transform:translateX(1px)}
.city-name{font-size:17px;font-weight:600;margin-bottom:2px}
.city-count{font-size:12px;color:var(--sub)}
.city-arrow{font-size:16px;color:var(--sub);transition:color .15s,transform .15s}
.city:hover .city-arrow{color:var(--blue);transform:translateX(3px)}
</style>
</head><body>
<div class="wrap">
  <div class="logo">Cheaper Quote Builder</div>
  <h1>Select city</h1>
  <p class="hint">City ke panels aur prices load honge</p>
  <div class="cities">
    <a class="city" href="quote.html?city=delhi">
      <div><div class="city-name">Delhi</div><div class="city-count">90 panels</div></div>
      <div class="city-arrow">→</div>
    </a>
    <a class="city" href="quote.html?city=mumbai">
      <div><div class="city-name">Mumbai</div><div class="city-count">85 panels</div></div>
      <div class="city-arrow">→</div>
    </a>
    <a class="city" href="quote.html?city=bengaluru">
      <div><div class="city-name">Bengaluru</div><div class="city-count">92 panels</div></div>
      <div class="city-arrow">→</div>
    </a>
    <a class="city" href="quote.html?city=hyderabad">
      <div><div class="city-name">Hyderabad</div><div class="city-count">94 panels</div></div>
      <div class="city-arrow">→</div>
    </a>
  </div>
</div>
</body></html>
