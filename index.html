<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheap Quote Builder</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#0F1624 0%,#141D2E 100%);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}

/* corner blobs */
.blob{position:fixed;border-radius:50%;pointer-events:none;filter:blur(90px)}
.blob-tl{width:420px;height:420px;top:-130px;left:-130px;background:radial-gradient(circle,rgba(45,100,255,0.18),transparent 70%)}
.blob-br{width:380px;height:380px;bottom:-110px;right:-110px;background:radial-gradient(circle,rgba(77,163,255,0.14),transparent 70%)}

.wrap{
  position:relative;z-index:1;
  width:100%;max-width:520px;
  padding:44px 24px 40px;
}

/* ── Logo ── */
.logo-outer{display:flex;justify-content:center;margin-bottom:28px}
.logo-inner{
  display:flex;align-items:center;gap:11px;
  padding:10px 18px;
  border:1.5px solid #4DA3FF;
  border-radius:14px;
}
.uc-badge{
  width:38px;height:38px;border-radius:9px;
  background:#000;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:#fff;letter-spacing:-0.5px;
  flex-shrink:0;
}
.uc-name{display:flex;flex-direction:column;line-height:1.25;gap:1px}
.uc-name span{font-size:14px;font-weight:600;color:#fff}

/* ── Headline ── */
h1{
  text-align:center;
  font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;
  color:#fff;margin-bottom:13px;
}
.grad{
  background:linear-gradient(90deg,#4DA3FF,#2B6BFF);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.subtitle{
  text-align:center;font-size:15px;color:#A8B3C7;
  line-height:1.6;margin-bottom:38px;
}

/* ── Section title ── */
.sec{font-size:21px;font-weight:700;color:#fff;margin-bottom:14px}

/* ── City cards ── */
.cities{display:flex;flex-direction:column;gap:10px}
.city{
  display:flex;align-items:center;gap:16px;
  padding:15px 20px;
  background:#1B2436;
  border:1px solid rgba(255,255,255,0.06);
  border-radius:16px;
  text-decoration:none;
  cursor:pointer;
  transition:border-color .18s,transform .14s,box-shadow .18s;
}
.city:hover{
  border-color:rgba(77,163,255,0.45);
  transform:translateX(5px);
  box-shadow:0 6px 24px rgba(77,163,255,0.10);
}
.city:active{transform:translateX(2px)}

.ic{
  width:52px;height:52px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ic svg{width:36px;height:36px}
.ic-dl{background:rgba(77,163,255,0.13);color:#4DA3FF}
.ic-mu{background:rgba(52,199,89,0.13); color:#34C759}
.ic-bn{background:rgba(175,82,222,0.13);color:#AF52DE}
.ic-hd{background:rgba(255,149,0,0.13); color:#FF9500}

.city-info{flex:1}
.city-name{font-size:17px;font-weight:700;color:#fff;margin-bottom:3px}
.city-ct{font-size:13px;color:#A8B3C7}
.city-arr{font-size:22px;color:#4DA3FF;line-height:1}
</style>
</head><body>

<div class="blob blob-tl"></div>
<div class="blob blob-br"></div>

<div class="wrap">

  <!-- Logo -->
  <div class="logo-outer">
    <div class="logo-inner">
      <div class="uc-badge">uc</div>
      <div class="uc-name"><span>Urban</span><span>Company</span></div>
    </div>
  </div>

  <!-- Title -->
  <h1><span class="grad">Cheap Quote</span> Builder</h1>
  <p class="subtitle">Make your quote cheaper without changing the taste of the customer.</p>

  <!-- City list -->
  <div class="sec">Select city</div>
  <div class="cities">

    <!-- Delhi -->
    <a class="city" href="quote.html?city=delhi">
      <div class="ic ic-dl">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="58" x2="60" y2="58"/>
          <line x1="8" y1="55" x2="56" y2="55"/>
          <path d="M12 55v-5h40v5"/>
          <line x1="16" y1="50" x2="16" y2="34"/>
          <line x1="20" y1="50" x2="20" y2="34"/>
          <line x1="44" y1="50" x2="44" y2="34"/>
          <line x1="48" y1="50" x2="48" y2="34"/>
          <path d="M16 34 Q32 8 48 34"/>
          <path d="M20 34 Q32 14 44 34"/>
          <line x1="28" y1="12" x2="36" y2="12"/>
          <line x1="32" y1="7" x2="32" y2="12"/>
          <circle cx="32" cy="6" r="2" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="city-info">
        <div class="city-name">Delhi</div>
        <div class="city-ct">90 panels</div>
      </div>
      <div class="city-arr">→</div>
    </a>

    <!-- Mumbai -->
    <a class="city" href="quote.html?city=mumbai">
      <div class="ic ic-mu">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="58" x2="60" y2="58"/>
          <line x1="6" y1="55" x2="58" y2="55"/>
          <rect x="8" y="30" width="48" height="25" rx="1"/>
          <path d="M22 55v-13 Q32 24 42 42v13"/>
          <rect x="8" y="20" width="11" height="22" rx="1"/>
          <path d="M8 20 Q13.5 11 19 20"/>
          <rect x="45" y="20" width="11" height="22" rx="1"/>
          <path d="M45 20 Q50.5 11 56 20"/>
          <path d="M8 55v-10 Q13.5 36 19 45v10"/>
          <path d="M45 55v-10 Q50.5 36 56 45v10"/>
          <line x1="10" y1="27" x2="18" y2="27"/>
          <line x1="46" y1="27" x2="54" y2="27"/>
        </svg>
      </div>
      <div class="city-info">
        <div class="city-name">Mumbai</div>
        <div class="city-ct">85 panels</div>
      </div>
      <div class="city-arr">→</div>
    </a>

    <!-- Bengaluru -->
    <a class="city" href="quote.html?city=bengaluru">
      <div class="ic ic-bn">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="58" x2="60" y2="58"/>
          <line x1="6" y1="55" x2="58" y2="55"/>
          <rect x="6" y="44" width="52" height="11" rx="1"/>
          <line x1="13" y1="44" x2="13" y2="55"/>
          <line x1="22" y1="44" x2="22" y2="55"/>
          <line x1="32" y1="44" x2="32" y2="55"/>
          <line x1="42" y1="44" x2="42" y2="55"/>
          <line x1="51" y1="44" x2="51" y2="55"/>
          <rect x="12" y="34" width="40" height="10" rx="1"/>
          <path d="M22 34 Q22 18 32 15 Q42 18 42 34"/>
          <line x1="25" y1="34" x2="39" y2="34"/>
          <path d="M10 34 Q10 28 16 27 Q22 28 22 34"/>
          <path d="M42 34 Q42 28 48 27 Q54 28 54 34"/>
          <line x1="32" y1="10" x2="32" y2="15"/>
          <circle cx="32" cy="9" r="2" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="city-info">
        <div class="city-name">Bengaluru</div>
        <div class="city-ct">92 panels</div>
      </div>
      <div class="city-arr">→</div>
    </a>

    <!-- Hyderabad -->
    <a class="city" href="quote.html?city=hyderabad">
      <div class="ic ic-hd">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="58" x2="60" y2="58"/>
          <line x1="8" y1="55" x2="56" y2="55"/>
          <rect x="16" y="38" width="32" height="17" rx="1"/>
          <path d="M24 55v-12 Q32 31 40 43v12"/>
          <line x1="16" y1="45" x2="48" y2="45"/>
          <rect x="6" y="24" width="10" height="31" rx="1"/>
          <path d="M6 24 Q11 14 16 24"/>
          <line x1="32" y1="11" x2="32" y2="16"/>
          <line x1="4" y1="33" x2="18" y2="33"/>
          <circle cx="11" cy="13" r="2" fill="currentColor" stroke="none"/>
          <rect x="48" y="24" width="10" height="31" rx="1"/>
          <path d="M48 24 Q53 14 58 24"/>
          <line x1="46" y1="33" x2="60" y2="33"/>
          <circle cx="53" cy="13" r="2" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="city-info">
        <div class="city-name">Hyderabad</div>
        <div class="city-ct">94 panels</div>
      </div>
      <div class="city-arr">→</div>
    </a>

  </div>
</div>
</body></html>
