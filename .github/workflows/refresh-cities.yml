name: Rebuild City Catalogs

on:
  push:
    paths:
      - 'assets/data/master.json'   # Apps Script pushes this → auto-rebuild
  workflow_dispatch:                 # manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild per-city catalog JSONs
        run: python3 scripts/build_cities.py

      - name: Commit rebuilt city JSONs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/delhi.json assets/data/mumbai.json assets/data/bengaluru.json assets/data/hyderabad.json
          if git diff --cached --quiet; then
            echo "No changes in city JSONs."
          else
            git commit -m "auto: rebuild city catalogs $(date -u '+%Y-%m-%d')"
            git push
            echo "City JSONs updated and pushed."
          fi
